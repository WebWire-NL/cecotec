# =============================================================================
# TEMPLATE — Tuya robot vacuum, "standard sweeper" generation
# =============================================================================
# A starting point, not a finished config. tuya-local matches a device by
# PRODUCT ID, so to use this:
#
#   1. Replace the product id below with your own. Everything else in the
#      `products:` entry is there so the next person can tell what this is.
#   2. Dump your device with tinytuya and delete every entity whose datapoint it
#      does not report. Every datapoint here is marked `optional: true`, so an
#      unsupported one is skipped instead of failing the whole config.
#   3. Drop or rename anything whose meaning you cannot confirm on your own unit.
#   4. Send it upstream as custom_components/tuya_local/devices/<brand>_<model>.yaml
#
# The datapoint ids and enum values are the Tuya standard sweeper layout, shared
# across rebadges — ILIFE, ABIR, Neatsvor, Proscenic, Medion, Liectroux, Rowenta,
# Kogan, Kabum, Blaupunkt, Ttec, Cecotec and others all reuse it. Check
# docs/sweeper-dp-generations.md to work out whether yours belongs to this
# generation; if the vacuum entity on your unit is on datapoints 1, 2, 4, 5, 9,
# 11 and 12, it does.
#
# Verified against two devices that share this generation: the Cecotec Conga
# 11090 in this repo, and Gadnic AC800 (opn3uutjlhbeojab).

name: Robot vacuum
products:
  - id: REPLACE_WITH_YOUR_PRODUCT_ID
    manufacturer: REPLACE_ME
    model: REPLACE_ME
entities:
  # ---------------------------------------------------------------------------
  # The vacuum itself
  # ---------------------------------------------------------------------------
  - entity: vacuum
    dps:
      - id: 1
        type: boolean
        name: power
      - id: 2
        type: boolean
        optional: true
        name: activate
        mapping:
          - dps_val: true
            value: false
          - dps_val: false
            value: true
      - id: 4
        type: string
        optional: true
        name: command
        mapping:
          - dps_val: smart
            value: smart
          - dps_val: zone
            value: zone
          - dps_val: pose
            value: clean_spot
          - dps_val: part
            value: partial
          - dps_val: goto_charge
            value: return_to_base
      - id: 5
        type: string
        name: status
        mapping:
          - dps_val: standby
            value: idle
          - dps_val: zone_clean
            value: cleaning
          - dps_val: part_clean
            value: cleaning
          - dps_val: cleaning
            value: cleaning
          - dps_val: paused
            value: paused
          - dps_val: goto_pos
            value: cleaning
          - dps_val: pos_arrived
            value: idle
          - dps_val: pos_unarrive
            value: idle
          - dps_val: goto_charge
            value: returning
          - dps_val: charging
            value: charging
          - dps_val: charge_done
            value: docked
          - dps_val: sleep
            value: idle
      - id: 9
        type: string
        name: fan_speed
        mapping:
          - dps_val: gentle
            value: gentle
          - dps_val: normal
            value: normal
          - dps_val: strong
            value: strong
          - dps_val: max
            value: maximum
      - id: 11
        type: boolean
        optional: true
        name: locate
      - id: 12
        type: string
        optional: true
        name: direction_control
        mapping:
          - dps_val: forward
            value: forward
          - dps_val: backward
            value: backward
          - dps_val: turn_left
            value: left
          - dps_val: turn_right
            value: right
          - dps_val: stop
            value: stop

  # ---------------------------------------------------------------------------
  # Controls
  # ---------------------------------------------------------------------------
  - entity: switch
    name: Charge
    icon: mdi:battery-charging
    category: config
    dps:
      - id: 3
        type: boolean
        optional: true
        name: switch

  - entity: select
    name: Water level
    icon: mdi:water
    category: config
    dps:
      - id: 10
        type: string
        optional: true
        name: option
        mapping:
          - dps_val: closed
            value: "off"
          - dps_val: low
            value: low
          - dps_val: middle
            value: medium
          - dps_val: high
            value: high

  - entity: button
    name: Reset map
    icon: mdi:map-marker-remove
    category: config
    dps:
      - id: 13
        type: boolean
        optional: true
        name: button

  - entity: switch
    name: Do not disturb
    icon: mdi:sleep
    category: config
    dps:
      - id: 25
        type: boolean
        optional: true
        name: switch

  - entity: number
    translation_key: volume
    category: config
    dps:
      - id: 26
        type: integer
        optional: true
        name: value
        unit: "%"
        range:
          min: 0
          max: 100

  - entity: switch
    name: Break clean
    category: config
    dps:
      - id: 27
        type: boolean
        optional: true
        name: switch

  - entity: switch
    name: Auto boost
    icon: mdi:car-turbocharger
    category: config
    dps:
      - id: 45
        type: boolean
        optional: true
        name: switch

  - entity: switch
    name: Y-shape mop mode
    icon: mdi:vector-square
    category: config
    dps:
      - id: 48
        type: boolean
        optional: true
        name: switch

  - entity: switch
    name: Edge clean mode
    category: config
    dps:
      - id: 101
        type: boolean
        optional: true
        name: switch

  - entity: switch
    name: Spiral clean mode
    category: config
    dps:
      - id: 102
        type: boolean
        optional: true
        name: switch

  # ---------------------------------------------------------------------------
  # Auto-empty base
  # ---------------------------------------------------------------------------
  - entity: switch
    name: Auto dust collection
    icon: mdi:trash-can
    category: config
    dps:
      - id: 38
        type: boolean
        optional: true
        name: switch

  - entity: select
    name: Dust collection frequency
    icon: mdi:delete
    category: config
    dps:
      - id: 37
        type: integer
        optional: true
        name: option
        mapping:
          - dps_val: 0
            value: Never
          - dps_val: 1
            value: Once
          - dps_val: 2
            value: Twice
          - dps_val: 3
            value: Three times
          - dps_val: 4
            value: Four times

  - entity: switch
    name: Customize mode
    category: config
    dps:
      - id: 39
        type: boolean
        optional: true
        name: switch

  # ---------------------------------------------------------------------------
  # Consumables — counters and their resets
  # ---------------------------------------------------------------------------
  - entity: number
    name: Edge brush life
    category: config
    class: duration
    dps:
      - id: 17
        type: integer
        optional: true
        name: value
        unit: min
        range:
          min: 0
          max: 9000

  - entity: button
    name: Reset edge brush
    category: config
    dps:
      - id: 18
        type: boolean
        optional: true
        name: button

  - entity: number
    name: Roll brush life
    category: config
    class: duration
    dps:
      - id: 19
        type: integer
        optional: true
        name: value
        unit: min
        range:
          min: 0
          max: 18000

  - entity: button
    name: Reset roll brush
    category: config
    dps:
      - id: 20
        type: boolean
        optional: true
        name: button

  - entity: number
    name: Filter life
    category: config
    class: duration
    dps:
      - id: 21
        type: integer
        optional: true
        name: value
        unit: min
        range:
          min: 0
          max: 9000

  - entity: button
    name: Reset filter
    category: config
    dps:
      - id: 22
        type: boolean
        optional: true
        name: button

  - entity: number
    name: Mop cloth life
    category: config
    class: duration
    dps:
      - id: 23
        type: integer
        optional: true
        name: value
        unit: min
        range:
          min: 0
          max: 9000

  - entity: button
    name: Reset mop cloth
    category: config
    dps:
      - id: 24
        type: boolean
        optional: true
        name: button

  - entity: number
    name: Number of cleans
    icon: mdi:robot-vacuum
    category: config
    dps:
      - id: 37
        type: integer
        optional: true
        name: value
        unit: times
        range:
          min: 0
          max: 4

  # ---------------------------------------------------------------------------
  # Diagnostics
  # ---------------------------------------------------------------------------
  - entity: sensor
    name: Cleaning time
    class: duration
    category: diagnostic
    dps:
      - id: 6
        type: integer
        optional: true
        name: sensor
        unit: min

  - entity: sensor
    name: Cleaning area
    class: area
    category: diagnostic
    dps:
      - id: 7
        type: integer
        optional: true
        name: sensor
        unit: m2

  - entity: sensor
    class: battery
    category: diagnostic
    dps:
      - id: 8
        type: integer
        optional: true
        name: sensor
        unit: "%"

  - entity: binary_sensor
    name: Mop installed
    icon: mdi:water-plus
    category: diagnostic
    dps:
      - id: 40
        type: string
        optional: true
        name: sensor
        mapping:
          - dps_val: installed
            value: true
          - value: false

  - entity: binary_sensor
    class: problem
    category: diagnostic
    dps:
      - id: 28
        type: bitfield
        name: sensor
        mapping:
          - dps_val: 0
            value: false
          - value: true
      - id: 28
        type: bitfield
        optional: true
        name: fault_code
