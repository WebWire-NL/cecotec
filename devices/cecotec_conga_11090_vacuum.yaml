# Cecotec Conga 11090 Spin Revolution Home&Wash
# productId: kazdsquasfw0gmrn
# DP map confirmed against the device's own LAN status output
# (Tuya standard sweeper layout, category "sd")
name: Robot vacuum
products:
  - id: kazdsquasfw0gmrn
    manufacturer: Cecotec
    model: Conga 11090 Spin Revolution Home&Wash
entities:
  - entity: vacuum
    dps:
      - id: 1
        type: boolean
        name: power
      - id: 2
        type: boolean
        name: activate
        mapping:
          - dps_val: true
            value: false
          - dps_val: false
            value: true
      - id: 4
        type: string
        name: command
        mapping:
          - dps_val: smart
            value: Smart
          - dps_val: zone
            value: Zone
          - dps_val: pose
            value: Go to position
      - id: 5
        type: string
        name: status
        mapping:
          - dps_val: standby
            value: standby
          - dps_val: zone_clean
            value: cleaning
          - dps_val: part_clean
            value: cleaning
          - dps_val: cleaning
            value: cleaning
          - dps_val: paused
            value: paused
          - dps_val: goto_pos
            value: Going to location
          - dps_val: pos_arrived
            value: idle
          - dps_val: pos_unarrive
            value: idle
          - dps_val: goto_charge
            value: returning
          - dps_val: charging
            value: charging
          - dps_val: charge_done
            value: docked
          - dps_val: sleep
            value: idle
      - id: 9
        type: string
        name: fan_speed
        mapping:
          - dps_val: gentle
            value: gentle
          - dps_val: normal
            value: normal
          - dps_val: strong
            value: strong
      - id: 11
        type: boolean
        optional: true
        name: locate
      - id: 12
        type: string
        optional: true
        name: direction_control
        mapping:
          - dps_val: forward
            value: forward
          - dps_val: backward
            value: backward
          - dps_val: turn_left
            value: left
          - dps_val: turn_right
            value: right
          - dps_val: stop
            value: stop
  - entity: switch
    name: Charge
    category: config
    dps:
      - id: 3
        type: boolean
        name: switch
  - entity: select
    name: Water level
    icon: mdi:water
    category: config
    dps:
      - id: 10
        type: string
        name: option
        mapping:
          - dps_val: low
            value: low
          - dps_val: middle
            value: medium
          - dps_val: high
            value: high
  - entity: button
    name: Reset map
    icon: mdi:map-marker-remove
    category: config
    dps:
      - id: 13
        type: boolean
        name: button
  - entity: sensor
    class: duration
    category: diagnostic
    dps:
      - id: 6
        type: integer
        optional: true
        name: sensor
        unit: min
  - entity: sensor
    class: area
    category: diagnostic
    dps:
      - id: 7
        type: integer
        optional: true
        name: sensor
        unit: m2
  - entity: sensor
    class: battery
    category: diagnostic
    dps:
      - id: 8
        type: integer
        name: sensor
        unit: "%"
  - entity: number
    name: Edge brush life
    category: config
    class: duration
    dps:
      - id: 17
        type: integer
        name: value
        unit: min
        range:
          min: 0
          max: 9000
  - entity: button
    name: Reset edge brush
    category: config
    dps:
      - id: 18
        type: boolean
        name: button
  - entity: number
    name: Roll brush life
    category: config
    class: duration
    dps:
      - id: 19
        type: integer
        name: value
        unit: min
        range:
          min: 0
          max: 18000
  - entity: button
    name: Reset roll brush
    category: config
    dps:
      - id: 20
        type: boolean
        name: button
  - entity: number
    name: Filter life
    category: config
    class: duration
    dps:
      - id: 21
        type: integer
        name: value
        unit: min
        range:
          min: 0
          max: 9000
  - entity: button
    name: Reset filter
    category: config
    dps:
      - id: 22
        type: boolean
        name: button
  - entity: number
    name: Mop cloth life
    category: config
    class: duration
    dps:
      - id: 23
        type: integer
        name: value
        unit: min
        range:
          min: 0
          max: 9000
  - entity: button
    name: Reset mop cloth
    category: config
    dps:
      - id: 24
        type: boolean
        name: button
  - entity: switch
    name: Do not disturb
    icon: mdi:sleep
    category: config
    dps:
      - id: 25
        type: boolean
        name: switch
  - entity: number
    translation_key: volume
    category: config
    dps:
      - id: 26
        type: integer
        name: value
        unit: "%"
        range:
          min: 0
          max: 100
  - entity: switch
    name: Break clean
    category: config
    dps:
      - id: 27
        type: boolean
        name: switch
  - entity: binary_sensor
    class: problem
    category: diagnostic
    dps:
      - id: 28
        type: base64
        optional: true
        name: sensor
        mapping:
          - dps_val: null
            value: false
          - value: true
  - entity: number
    name: Number of cleans
    icon: mdi:robot-vacuum
    category: config
    dps:
      - id: 37
        type: integer
        name: value
        unit: times
        range:
          min: 0
          max: 4
  - entity: switch
    name: Auto dust collection
    icon: mdi:trash-can
    category: config
    dps:
      - id: 38
        type: boolean
        name: switch
  - entity: switch
    name: Customize mode
    category: config
    dps:
      - id: 39
        type: boolean
        name: switch
